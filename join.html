<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join OpenLake - Registration</title>
    <link rel="icon" type="image/png" href="openlake.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap" rel="stylesheet">
    <style>
        .form-container {
            max-width: 600px;
            margin: 60px auto 100px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 168, 232, 0.25);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 31, 63, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: #001f3f;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 168, 232, 0.3);
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            color: #001f3f;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #00a8e8;
            box-shadow: 0 0 10px rgba(0, 168, 232, 0.25);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #001f3f, #0077b6);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 168, 232, 0.3);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #0077b6, #00a8e8);
        }

        /* Success Card Popup */
        .success-box {
            display: none;
            background: rgba(16, 185, 129, 0.12);
            border: 2px solid #10b981;
            border-radius: 16px;
            padding: 28px 20px;
            margin-top: 20px;
            animation: popFromAbove 0.5s ease forwards;
        }

        .success-box h3 {
            color: #065f46;
            margin-bottom: 10px;
            font-size: 1.4rem;
        }

        .success-box p {
            color: #047857;
            font-size: 1.05rem;
            font-weight: 700;
            line-height: 1.5;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0077b6;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
            <img src="openlake.svg" alt="OpenLake Logo" class="logo">
            <h1 class="title">OpenLake</h1>
        </a>
        <nav class="nav-links">
            <a href="index.html#about">About</a>
            <a href="index.html#projects">Projects</a>
            <a href="index.html#events">Events</a>
            <a href="index.html#domains">Domains</a>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <span class="badge">JOIN THE CLUB</span>
            <h2 style="color: #001f3f; margin: 12px 0 24px;">Member Registration</h2>

            <form id="join-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">IIT Bhilai Email ID</label>
                    <input type="email" id="email" required placeholder="username@iitbhilai.ac.in">
                </div>

                <div class="form-group">
                    <label for="domain">Primary Interest Domain</label>
                    <select id="domain" required>
                        <option value="" disabled selected>Select a domain</option>
                        <option value="web">Web Development</option>
                        <option value="app">App Development</option>
                        <option value="game">Game Development</option>
                        <option value="aiml">AI / Machine Learning</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit Application</button>
            </form>

            <div id="success-message" class="success-box">
                <h3>🎉 Registration Successful!</h3>
                <p>Don't forget to join OLMP session tomorrow at 6pm-8pm.</p>
                <a href="index.html" class="back-link">← Return to Main Page</a>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('join-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('join-form').style.display = 'none';
            document.getElementById('success-message').style.display = 'block';
        });
    </script>
</body>

</html>
